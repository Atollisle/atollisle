<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atoll Isle — Super Admin</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='20' fill='none' stroke='%231F8A8C' stroke-width='5'/%3E%3Cpath d='M32 9 L32 34 L45 34 Z' fill='%23D8472B'/%3E%3Ccircle cx='32' cy='34' r='3' fill='%230B2E35'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@500;600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B2E35; --ink-2:#123F47; --teal:#1F8A8C; --teal-dim:#1F8A8C33;
    --sand:#F3ECDD; --sand-2:#EAE0C9; --coral:#D8472B; --coral-dim:#D8472B22;
    --charcoal:#1C2521; --line:rgba(11,46,53,0.14); --white:#FFFDF8;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--sand); color:var(--charcoal); font-family:'Work Sans', sans-serif;}
  h1,h2,h3{font-family:'Instrument Serif', serif; font-weight:400; margin:0;}
  .eyebrow{font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--teal); font-weight:600;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  /* login */
  #login{min-height:100vh; background:var(--ink); color:var(--white); display:flex; align-items:center; justify-content:center; padding:20px;}
  .login-box{width:100%; max-width:360px;}
  .logo-row{display:flex; align-items:center; gap:10px; margin-bottom:22px;}
  .login-box input{width:100%; padding:12px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.25); background:rgba(255,255,255,0.06); color:var(--white); font-family:'Work Sans',sans-serif; font-size:14px; margin-bottom:12px;}
  .login-box input::placeholder{color:#9FC7C3;}
  .login-box button{width:100%; padding:13px; border:none; border-radius:9px; background:var(--coral); color:var(--white); font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:0.03em; cursor:pointer;}
  .login-err{font-family:'IBM Plex Mono',monospace; font-size:12px; color:#FFB4A0; margin-bottom:10px;}
  /* app shell */
  #app{max-width:1100px; margin:0 auto; padding:0 24px 60px;}
  header{display:flex; align-items:center; justify-content:space-between; padding:20px 0; border-bottom:1px solid var(--line); margin-bottom:22px;}
  header .apiline{font-family:'IBM Plex Mono',monospace; font-size:10px; color:#7c8a85;}
  .tabs{display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap;}
  .tab{padding:9px 16px; border-radius:20px; border:1px solid var(--line); background:var(--white); font-family:'IBM Plex Mono',monospace; font-size:12px; cursor:pointer;}
  .tab.active{background:var(--ink); color:var(--white); border-color:var(--ink);}
  .tab .count{background:var(--coral); color:var(--white); border-radius:10px; padding:1px 6px; font-size:10px; margin-left:6px;}
  .panel{display:none;}
  .panel.active{display:block;}
  .row-card{background:var(--white); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;}
  .row-card h3{font-size:19px;}
  .row-card .meta{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--teal); margin-top:3px;}
  .row-card .sub{font-size:13px; color:#3a4642; margin-top:8px; line-height:1.5;}
  .btns{display:flex; gap:8px; flex-wrap:wrap;}
  .btn{padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:var(--white); font-family:'IBM Plex Mono',monospace; font-size:11.5px; cursor:pointer;}
  .btn.danger{background:var(--coral); color:var(--white); border-color:var(--coral);}
  .btn.primary{background:var(--ink); color:var(--white); border-color:var(--ink);}
  .badge{font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.05em; padding:3px 8px; border-radius:20px; text-transform:uppercase;}
  .badge.google{background:var(--coral-dim); color:var(--coral);}
  .badge.owner{background:var(--teal-dim); color:var(--teal);}
  .badge.pro{background:var(--coral); color:var(--white);}
  .badge.free{background:var(--sand-2); color:var(--charcoal);}
  .empty{font-family:'IBM Plex Mono',monospace; font-size:12px; color:#7c8a85; padding:30px; text-align:center; border:1px dashed var(--line); border-radius:10px;}
  .filterbar{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .filterbar select, .filterbar input{padding:8px 10px; border-radius:8px; border:1px solid var(--line); font-family:'Work Sans',sans-serif; font-size:13px; background:var(--white);}
  .sync-row{display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap;}
  .field-btn{
    padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:var(--white); color:var(--charcoal);
    font-family:'IBM Plex Mono',monospace; font-size:12px; cursor:pointer;
  }
  .field-btn.placeholder{ color:#7c8a85; }
  /* ---------- themed popup (island picker) ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(11,46,53,0.6); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .sheet{ background:var(--sand); width:100%; max-width:440px; max-height:80vh; overflow-y:auto; border-radius:16px; }
  .sheet-head{ background:linear-gradient(135deg, var(--ink), var(--ink-2)); color:var(--white); padding:20px 20px 16px; position:relative; }
  .sheet-head .eyebrow{ color:#7FCFCB; }
  .sheet-head h2{ color:var(--white); font-size:22px; margin-top:6px; }
  .sheet-body{ padding:18px 20px 22px; }
  .close-x{ position:absolute; top:14px; right:16px; background:rgba(255,255,255,0.12); border:none; width:26px; height:26px; border-radius:50%; font-size:16px; color:var(--white); cursor:pointer; }
  .search-input{ width:100%; padding:11px 14px; border-radius:8px; border:1px solid var(--line); font-family:'Work Sans', sans-serif; font-size:14px; background:var(--white); color:var(--charcoal); margin-bottom:12px; }
  .picker-group{ margin-bottom:4px; }
  .picker-atoll-heading{ font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--teal); padding:12px 4px 4px; }
  .picker-row{ display:flex; justify-content:space-between; align-items:center; padding:11px 8px; border-bottom:1px solid var(--line); cursor:pointer; font-size:14px; }
  .picker-row:hover{ background:var(--sand-2); }
  .picker-atoll{ font-family:'IBM Plex Mono', monospace; font-size:10px; color:#9aa39e; }
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <div class="logo-row">
      <svg width="32" height="32" viewBox="0 0 64 64"><circle cx="32" cy="34" r="20" fill="none" stroke="#1F8A8C" stroke-width="5"/><path d="M32 9 L32 34 L45 34 Z" fill="#D8472B"/><circle cx="32" cy="34" r="3" fill="#123F47"/></svg>
      <div>
        <span class="eyebrow" style="color:#7FCFCB;">Atoll Isle</span>
        <h2 style="color:#fff;">Super Admin</h2>
      </div>
    </div>
    <div class="login-err mono" id="loginErr" style="display:none;"></div>
    <input type="password" id="passcodeInput" placeholder="Admin passcode">
    <button id="loginBtn">Sign in</button>
  </div>
</div>

<div id="app" style="display:none;">
  <header>
    <div class="logo-row">
      <svg width="28" height="28" viewBox="0 0 64 64"><circle cx="32" cy="34" r="20" fill="none" stroke="#1F8A8C" stroke-width="5"/><path d="M32 9 L32 34 L45 34 Z" fill="#D8472B"/><circle cx="32" cy="34" r="3" fill="#123F47"/></svg>
      <div>
        <span class="eyebrow">Atoll Isle</span>
        <h1 style="font-size:24px;">Super Admin</h1>
      </div>
    </div>
    <div class="apiline" id="apiLine"></div>
  </header>

  <div class="tabs">
    <button class="tab active" data-panel="flags">Duplicate Flags <span class="count" id="flagCount">0</span></button>
    <button class="tab" data-panel="businesses">Businesses</button>
    <button class="tab" data-panel="accounts">Business Accounts</button>
  </div>

  <!-- DUPLICATE FLAGS -->
  <div class="panel active" id="panel-flags">
    <p style="font-size:13px; color:#3a4642; margin-top:0;">Raised automatically whenever a business signs up with a name that matches an existing public (Google-sourced) listing on the same island. Removing the public listing hands the page over to the real owner's listing.</p>
    <div id="flagsList"></div>
  </div>

  <!-- BUSINESSES -->
  <div class="panel" id="panel-businesses">
    <div class="sync-row">
      <button class="field-btn" id="syncIslandBtn" data-island="Maafushi">Maafushi</button>
      <button class="btn primary" id="syncBtn">Sync this island</button>
      <button class="btn primary" id="syncAllBtn">Sync ALL islands</button>
      <span class="mono" id="syncStatus" style="font-size:11.5px; color:#7c8a85;"></span>
    </div>
    <div class="filterbar">
      <button class="field-btn placeholder" id="filterIslandBtn" data-island="">All islands</button>
      <select id="filterSource"><option value="">All sources</option><option value="owner">Owner-listed</option><option value="google">Google-sourced</option></select>
    </div>
    <div id="businessesList"></div>
  </div>

  <!-- ACCOUNTS -->
  <div class="panel" id="panel-accounts">
    <div id="accountsList"></div>
  </div>
</div>

<script>
(function(){
  const ATOLLS = [
    {atoll:"Haa Alif Atoll", islands:["Dhiddhoo","Baarah","Filladhoo","Hoarafushi","Ihavandhoo","Kelaa","Maarandhoo","Muraidhoo","Thakandhoo","Utheemu","Vashafaru"]},
    {atoll:"Haa Dhaalu Atoll", islands:["Kulhudhuffushi","Finey","Hanimaadhoo","Hirimaradhoo","Kunbifulhu","Kurinbi","Makunudhoo","Naivaadhoo","Nellaidhoo","Neykurendhoo","Nolhivaram","Nolhivaranfaru","Kumundhoo","Faridhoo"]},
    {atoll:"Shaviyani Atoll", islands:["Funadhoo","Bileffahi","Feevah","Feydhoo","Foakaidhoo","Kanditheemu","Komandoo","Lhaimagu","Maroshi","Milandhoo","Narudhoo","Noomaraa"]},
    {atoll:"Noonu Atoll", islands:["Manadhoo","Fohdhoo","Henbadhoo","Holhudhoo","Kendhikolhudhoo","Kudafari","Landhoo","Lhohi","Maafaru","Maalhendhoo","Miladhoo","Magoodhoo"]},
    {atoll:"Raa Atoll", islands:["Ungoofaaru","Alifushi","Angolhitheem","Fainu","Hulhudhufaaru","Inguraidhoo","Inemaura","Kandholhudhoo","Maakurathu","Maduvvari","Meedhoo","Rasmaadhoo","Rasgetheemu","Vaadhoo"]},
    {atoll:"Baa Atoll", islands:["Eydhafushi","Dharavandhoo","Dhonfanu","Feridhoo","Fulhadhoo","Goidhoo","Hithaadhoo","Kamadhoo","Kendhoo","Kihaadhoo","Kudarikilu","Maalhos","Thulhaadhoo"]},
    {atoll:"Lhaviyani Atoll", islands:["Naifaru","Hinnavaru","Kurendhoo","Olhuvelifushi","Maafilaafushi"]},
    {atoll:"Kaafu Atoll", islands:["Male'","Hulhumalé","Dhiffushi","Gulhi","Guraidhoo","Himmafushi","Huraa","Kaashidhoo","Maafushi","Thulusdhoo"]},
    {atoll:"Alifu Alifu Atoll", islands:["Rasdhoo","Bodufulhadhoo","Feridhoo","Himandhoo","Maalhoss","Mathiveri","Thoddoo","Ukulhas"]},
    {atoll:"Alifu Dhaalu Atoll", islands:["Mahibadhoo","Dhangethi","Dhigurah","Fenfushi","Hangnaameedhoo","Kunburudhoo","Migaahdhigoo","Maamigili","Omadhoo"]},
    {atoll:"Vaavu Atoll", islands:["Felidhoo","Fulidhoo","Keyodhoo","Rakeedhoo","Thinadhoo"]},
    {atoll:"Meemu Atoll", islands:["Muli","Dhiggaru","Kolhufushi","Maduvvari","Mulah","Naalaafushi","Veyvah"]},
    {atoll:"Faafu Atoll", islands:["Nilandhoo","Bileddhoo","Dharanboodhoo","Magoodhoo","Feeali"]},
    {atoll:"Dhaalu Atoll", islands:["Kudahuvadhoo","Bandidhoo","Gemendhoo","Hulhudheli","Meedhoo","Rinbudhoo"]},
    {atoll:"Thaa Atoll", islands:["Veymandoo","Buruni","Dhiyamigili","Gaadhiffushi","Guraidhoo","Hirilandhoo","Kandoodhoo","Kinbidhoo","Madifushi","Omadhoo","Thimarafushi","Vandhoo","Dandhoo"]},
    {atoll:"Laamu Atoll", islands:["Fonadhoo","Gan","Isdhoo","Kalaidhoo","Kunahandhoo","Maabaidhoo","Maamendhoo","Maavah","Mundoo","Hithadhoo"]},
    {atoll:"Gaafu Alif Atoll", islands:["Vilingili","Dhaandhoo","Devvadhoo","Gemanafushi","Kandhuhulhudhoo","Kolamaafushi","Maamendhoo","Nilandhoo"]},
    {atoll:"Gaafu Dhaalu Atoll", islands:["Thinadhoo","Faresmaathoda","Fiyoari","Gadhdhoo","Hoadhedhdhoo","Madaveli","Nadallaa","Rathafandhoo","Vaadhoo"]},
    {atoll:"Gnaviyani Atoll", islands:["Fuvahmulah"]},
    {atoll:"Seenu Atoll", islands:["Hithadhoo","Feydhoo","Hulhudhoo","Maradhoo","Maradhoofeydhoo","Meedhoo"]}
  ];
  const ISLANDS = ATOLLS.reduce((acc,a)=>acc.concat(a.islands), []);
  const API_BASE = "https://atollisle.onrender.com"; // same value as in index.html

  let passcode = null;

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s){ return escapeHtml(s); }

  function renderPickerList(container, filterText, onSelect){
    const filter = (filterText || '').trim().toLowerCase();
    if(filter){
      const matches = [];
      ATOLLS.forEach(a => a.islands.forEach(isl => { if(isl.toLowerCase().includes(filter)) matches.push({isl, atoll:a.atoll}); }));
      container.innerHTML = matches.length ? matches.map(m => `
        <div class="picker-row" data-island="${escapeAttr(m.isl)}"><span>${escapeHtml(m.isl)}</span><span class="picker-atoll">${escapeHtml(m.atoll)}</span></div>
      `).join('') : `<div class="empty">No islands match "${escapeHtml(filterText)}"</div>`;
    } else {
      container.innerHTML = ATOLLS.map(a => `
        <div class="picker-group">
          <div class="picker-atoll-heading">${escapeHtml(a.atoll)}</div>
          ${a.islands.map(isl => `<div class="picker-row" data-island="${escapeAttr(isl)}"><span>${escapeHtml(isl)}</span></div>`).join('')}
        </div>`).join('');
    }
    container.querySelectorAll('.picker-row').forEach(row => {
      row.addEventListener('click', () => onSelect(row.getAttribute('data-island')));
    });
  }

  function openIslandPicker(onSelect, opts){
    opts = opts || {};
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="sheet">
        <div class="sheet-head">
          <button class="close-x" id="islandPickerClose">&times;</button>
          <span class="eyebrow">Select island</span>
          <h2>${opts.title || 'Choose an island'}</h2>
        </div>
        <div class="sheet-body">
          <input type="text" id="islandPickerSearch" class="search-input" placeholder="Search islands…">
          <div id="islandPickerResults" style="max-height:48vh; overflow-y:auto;"></div>
          ${opts.allowAll ? `<div class="picker-row" data-island="" style="border-top:2px solid var(--line); margin-top:6px; font-weight:600;">All islands</div>` : ''}
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.remove(); });
    document.getElementById('islandPickerClose').addEventListener('click', ()=>overlay.remove());
    const allRow = overlay.querySelector('.sheet-body > .picker-row[data-island=""]');
    if(allRow) allRow.addEventListener('click', ()=>{ overlay.remove(); onSelect(''); });
    const resultsEl = document.getElementById('islandPickerResults');
    const searchEl = document.getElementById('islandPickerSearch');
    function refresh(){ renderPickerList(resultsEl, searchEl.value, (isl)=>{ overlay.remove(); onSelect(isl); }); }
    searchEl.addEventListener('input', refresh);
    refresh();
    searchEl.focus();
  }
  function fmtDate(ms){ return ms ? new Date(ms).toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'}) : '—'; }

  async function adminApi(path, opts){
    opts = opts || {};
    const headers = Object.assign({ "Content-Type":"application/json", "x-admin-passcode": passcode || "" }, opts.headers || {});
    try{
      const res = await fetch(API_BASE + path, { method: opts.method || "GET", headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
      const data = await res.json().catch(()=>({}));
      if(!res.ok) return { ok:false, error: data.error || "Request failed" };
      return { ok:true, data };
    }catch(e){
      return { ok:false, error:"Can't reach the API — is server.js running at " + API_BASE + "?" };
    }
  }

  document.getElementById('loginBtn').addEventListener('click', async ()=>{
    const val = document.getElementById('passcodeInput').value;
    passcode = val;
    const check = await adminApi('/api/admin/duplicate-flags');
    const errEl = document.getElementById('loginErr');
    if(!check.ok){ errEl.textContent = check.error; errEl.style.display = 'block'; passcode = null; return; }
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('apiLine').textContent = 'API: ' + API_BASE;
    init();
  });
  document.getElementById('passcodeInput').addEventListener('keydown', (e)=>{ if(e.key === 'Enter') document.getElementById('loginBtn').click(); });

  document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.getAttribute('data-panel')).classList.add('active');
    });
  });

  async function loadFlags(){
    const r = await adminApi('/api/admin/duplicate-flags');
    const wrap = document.getElementById('flagsList');
    if(!r.ok){ wrap.innerHTML = `<div class="empty">${escapeHtml(r.error)}</div>`; return; }
    const pending = r.data.filter(f => f.status === 'pending');
    document.getElementById('flagCount').textContent = pending.length;
    if(!pending.length){ wrap.innerHTML = `<div class="empty">No pending flags — nothing to review right now.</div>`; return; }
    wrap.innerHTML = pending.map(f => `
      <div class="row-card">
        <div>
          <h3>${escapeHtml(f.businessName)}</h3>
          <div class="meta">${escapeHtml(f.island)} · signed up by ${escapeHtml(f.ownerEmail)}</div>
          <div class="sub">Matches public listing: <strong>${escapeHtml(f.matchedGoogleName)}</strong> · flagged ${fmtDate(f.createdAt)}</div>
        </div>
        <div class="btns">
          <button class="btn danger" data-remove="${f.id}">Remove public listing</button>
          <button class="btn" data-dismiss="${f.id}">Dismiss</button>
        </div>
      </div>`).join('');
    wrap.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        await adminApi('/api/admin/duplicate-flags/' + btn.getAttribute('data-remove') + '/resolve', { method:'POST', body:{action:'remove'} });
        loadFlags(); loadBusinesses();
      });
    });
    wrap.querySelectorAll('[data-dismiss]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        await adminApi('/api/admin/duplicate-flags/' + btn.getAttribute('data-dismiss') + '/resolve', { method:'POST', body:{action:'dismiss'} });
        loadFlags();
      });
    });
  }

  function addressMentionsIsland(address, island){
    if(!address) return true; // no address to check (owner-listed) — nothing to flag
    const norm = s => s.toLowerCase().replace(/['’]/g, "");
    return norm(address).includes(norm(island));
  }

  async function loadBusinesses(){
    const r = await adminApi('/api/admin/businesses');
    const wrap = document.getElementById('businessesList');
    if(!r.ok){ wrap.innerHTML = `<div class="empty">${escapeHtml(r.error)}</div>`; return; }
    const islandFilter = document.getElementById('filterIslandBtn').getAttribute('data-island');
    const sourceFilter = document.getElementById('filterSource').value;
    let list = r.data;
    if(islandFilter) list = list.filter(b => b.island === islandFilter);
    if(sourceFilter) list = list.filter(b => b.source === sourceFilter);
    if(!list.length){ wrap.innerHTML = `<div class="empty">No businesses match this filter.</div>`; return; }
    wrap.innerHTML = list.map(b => {
      const mismatch = b.source === 'google' && !addressMentionsIsland(b.desc, b.island);
      return `
      <div class="row-card">
        <div>
          <h3>${escapeHtml(b.name)} <span class="badge ${b.source}">${b.source === 'google' ? 'Google' : 'Owner'}</span> ${b.verified ? '<span class="badge owner">Verified</span>' : ''} ${mismatch ? '<span class="badge" style="background:#F5C34D33; color:#8a6d1a;">⚠ Address mismatch</span>' : ''}</h3>
          <div class="meta">${escapeHtml(b.category)} · ${escapeHtml(b.island)}${b.ownerEmail ? ' · ' + escapeHtml(b.ownerEmail) : ''}</div>
          <div class="sub">${escapeHtml(b.desc || '')}</div>
        </div>
        <div class="btns">
          <button class="btn" data-fix="${b.id}">Fix island</button>
          <button class="btn" data-verify="${b.id}" data-current="${b.verified}">${b.verified ? 'Unverify' : 'Mark verified'}</button>
          <button class="btn danger" data-del="${b.id}">Delete</button>
        </div>
      </div>`;
    }).join('');
    wrap.querySelectorAll('[data-verify]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const current = btn.getAttribute('data-current') === 'true';
        await adminApi('/api/admin/businesses/' + btn.getAttribute('data-verify'), { method:'PATCH', body:{verified: !current} });
        loadBusinesses();
      });
    });
    wrap.querySelectorAll('[data-fix]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        openIslandPicker(async (isl)=>{
          await adminApi('/api/admin/businesses/' + btn.getAttribute('data-fix'), { method:'PATCH', body:{island: isl} });
          loadBusinesses();
        }, { title: 'Move to correct island' });
      });
    });
    wrap.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        await adminApi('/api/admin/businesses/' + btn.getAttribute('data-del'), { method:'DELETE' });
        loadBusinesses();
      });
    });
  }

  async function loadAccounts(){
    const r = await adminApi('/api/admin/accounts');
    const wrap = document.getElementById('accountsList');
    if(!r.ok){ wrap.innerHTML = `<div class="empty">${escapeHtml(r.error)}</div>`; return; }
    if(!r.data.length){ wrap.innerHTML = `<div class="empty">No business accounts yet.</div>`; return; }
    wrap.innerHTML = r.data.map(a => {
      const effPro = a.isPro && a.proExpiry && a.proExpiry > Date.now();
      return `
      <div class="row-card">
        <div>
          <h3 style="font-size:16px;" class="mono">${escapeHtml(a.email)} <span class="badge ${effPro?'pro':'free'}">${effPro?'PRO':'FREE'}</span></h3>
          <div class="meta">Joined ${fmtDate(a.createdAt)}${effPro ? ' · Pro expires ' + fmtDate(a.proExpiry) : ''}</div>
        </div>
        <div class="btns">
          <button class="btn primary" data-grant="${a.email}">Grant / extend 30 days</button>
          ${a.isPro ? `<button class="btn danger" data-revoke="${a.email}">Revoke Pro</button>` : ''}
        </div>
      </div>`;
    }).join('');
    wrap.querySelectorAll('[data-grant]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        await adminApi('/api/admin/accounts/' + encodeURIComponent(btn.getAttribute('data-grant')) + '/grant-pro', { method:'POST' });
        loadAccounts();
      });
    });
    wrap.querySelectorAll('[data-revoke]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        await adminApi('/api/admin/accounts/' + encodeURIComponent(btn.getAttribute('data-revoke')) + '/revoke-pro', { method:'POST' });
        loadAccounts();
      });
    });
  }

  function init(){
    document.getElementById('syncIslandBtn').addEventListener('click', ()=>{
      openIslandPicker((isl)=>{
        const btn = document.getElementById('syncIslandBtn');
        btn.textContent = isl;
        btn.setAttribute('data-island', isl);
      }, { title: 'Island to sync' });
    });
    document.getElementById('filterIslandBtn').addEventListener('click', ()=>{
      openIslandPicker((isl)=>{
        const btn = document.getElementById('filterIslandBtn');
        btn.textContent = isl || 'All islands';
        btn.setAttribute('data-island', isl);
        btn.classList.toggle('placeholder', !isl);
        loadBusinesses();
      }, { title: 'Filter by island', allowAll: true });
    });
    document.getElementById('filterSource').addEventListener('change', loadBusinesses);
    document.getElementById('syncBtn').addEventListener('click', async ()=>{
      const island = document.getElementById('syncIslandBtn').getAttribute('data-island');
      const statusEl = document.getElementById('syncStatus');
      statusEl.textContent = "Syncing…";
      const r = await adminApi('/api/admin/sync-google/' + encodeURIComponent(island), { method:'POST' });
      statusEl.textContent = r.ok ? `Added ${r.data.added} new listing(s)${r.data.skippedMismatch ? `, skipped ${r.data.skippedMismatch} that didn't actually match this island` : ''}.` : r.error;
      if(r.ok) loadBusinesses();
    });
    document.getElementById('syncAllBtn').addEventListener('click', async ()=>{
      const statusEl = document.getElementById('syncStatus');
      statusEl.textContent = "Syncing every island — this takes a bit longer…";
      const r = await adminApi('/api/admin/sync-google-all', { method:'POST' });
      statusEl.textContent = r.ok ? `Added ${r.data.totalAdded} new listing(s) across all islands${r.data.totalSkippedMismatch ? `, skipped ${r.data.totalSkippedMismatch} that didn't match their island` : ''}.` : r.error;
      if(r.ok) loadBusinesses();
    });
    loadFlags();
    loadBusinesses();
    loadAccounts();
  }
})();
</script>
</body>
</html>
