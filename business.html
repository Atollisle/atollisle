<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atoll Isle — Business Portal</title>
<meta name="description" content="List your guesthouse, café, dive shop or excursion on Atoll Isle.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='20' fill='none' stroke='%231F8A8C' stroke-width='5'/%3E%3Cpath d='M32 9 L32 34 L45 34 Z' fill='%23D8472B'/%3E%3Ccircle cx='32' cy='34' r='3' fill='%230B2E35'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@500;600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B2E35; --ink-2:#123F47; --teal:#1F8A8C; --teal-dim:#1F8A8C33;
    --sand:#F3ECDD; --sand-2:#EAE0C9; --coral:#D8472B; --coral-dim:#D8472B22;
    --charcoal:#1C2521; --line: rgba(11,46,53,0.14); --white:#FFFDF8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{ background:var(--sand); color:var(--charcoal); font-family:'Work Sans', sans-serif; min-height:100vh; }
  .shell{ max-width:520px; margin:0 auto; min-height:100vh; background:var(--sand); position:relative; }
  h1,h2,h3{ font-family:'Instrument Serif', serif; font-weight:400; margin:0; }
  .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--teal); font-weight:600; }
  .logo-mark{ display:block; flex:0 0 auto; }
  .logo-row{ display:flex; align-items:center; gap:10px; }
  /* ---------- HEADER ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; background:var(--ink); color:var(--white);
  }
  .topbar h1{ color:var(--white); font-size:21px; }
  .topbar .eyebrow{ color:#7FCFCB; display:block; margin-bottom:2px; }
  .back-link{
    font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.06em; color:var(--white);
    text-decoration:none; border:1px solid rgba(255,255,255,0.35); padding:7px 10px; border-radius:20px;
  }
  .content{ padding:20px; padding-bottom:60px; }
  /* ---------- FORM CONTROLS ---------- */
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--teal); margin-bottom:5px; }
  .field input, .field select, .field textarea{ width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line); font-family:'Work Sans', sans-serif; font-size:14px; background:var(--white); color:var(--charcoal); }
  .field textarea{ resize:vertical; min-height:70px; }
  .field-btn{ width:100%; text-align:left; padding:11px 12px; border-radius:8px; border:1px solid var(--line); font-family:'Work Sans', sans-serif; font-size:14px; background:var(--white); color:var(--charcoal); cursor:pointer; }
  .field-btn.placeholder{ color:#9aa39e; }
  .btn-block{ width:100%; background:var(--ink); color:var(--white); border:none; font-family:'IBM Plex Mono', monospace; font-size:12.5px; letter-spacing:0.03em; padding:13px; border-radius:9px; cursor:pointer; margin-top:6px; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--charcoal); font-family:'IBM Plex Mono', monospace; font-size:12.5px; padding:13px 16px; border-radius:9px; cursor:pointer; }
  .del-btn{ background:transparent; border:none; color:var(--coral); font-family:'IBM Plex Mono', monospace; font-size:11px; cursor:pointer; }
  .auth-tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .auth-tab{ flex:1; text-align:center; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--white); font-family:'IBM Plex Mono', monospace; font-size:11.5px; cursor:pointer; }
  .auth-tab.active{ background:var(--ink); color:var(--white); border-color:var(--ink); }
  .auth-err{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--coral); margin:-4px 0 10px; }
  .section-label{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--teal); margin:22px 0 10px; display:flex; align-items:center; justify-content:space-between; }
  .empty{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:#7c8a85; padding:30px 8px; text-align:center; border:1px dashed var(--line); border-radius:10px; }
  .owner-card{ display:flex; justify-content:space-between; align-items:center; background:var(--white); border:1px solid var(--line); border-radius:9px; padding:12px 14px; margin-bottom:9px; }
  .owner-card .oc-name{ font-family:'Instrument Serif', serif; font-size:18px; }
  .owner-card .oc-cat{ font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--teal); }
  .acct-card{ background:var(--ink); color:var(--white); border-radius:12px; padding:16px; margin-bottom:18px; }
  .acct-top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .acct-email{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:#B9D8D5; word-break:break-all; }
  .acct-plan{ font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.06em; padding:5px 9px; border-radius:20px; flex:0 0 auto; margin-left:8px; }
  .acct-plan.pro{ background:var(--coral); }
  .acct-plan.free{ background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.25); }
  .acct-meta{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:#9FC7C3; margin-top:10px; line-height:1.7; }
  .acct-meta.warn{ color:#FFD1C2; }
  .pro-cta{ background:var(--coral); color:var(--white); border:none; font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.04em; padding:10px 16px; border-radius:8px; cursor:pointer; }
  /* ---------- THEMED POPUPS (search + atoll-grouped list, add-listing, claim, upgrade) ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(11,46,53,0.6); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .sheet{ background:var(--sand); width:100%; max-width:480px; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:0; position:relative; animation: sheetIn 0.32s cubic-bezier(.2,.9,.3,1); }
  @keyframes sheetIn{ from{ transform:translateY(24px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .sheet-head{ background:linear-gradient(135deg, var(--ink), var(--ink-2)); color:var(--white); padding:20px 20px 16px; position:relative; overflow:hidden; }
  .sheet-head.theme-ocean{ background:linear-gradient(135deg, #0B2E35, #146370); }
  .sheet-head.theme-warm{ background:linear-gradient(135deg, #123F47, #4A3626); }
  .sheet-head.theme-festive{ background:linear-gradient(135deg, #0B2E35, #6E2A1E); }
  .deco{ position:absolute; pointer-events:none; opacity:0.75; }
  @keyframes floatUp{ 0%{ transform:translateY(6px); opacity:0; } 15%{ opacity:0.8; } 100%{ transform:translateY(-46px); opacity:0; } }
  @keyframes sway{ 0%,100%{ transform:rotate(-6deg); } 50%{ transform:rotate(6deg); } }
  @keyframes twinkle{ 0%,100%{ opacity:0.25; transform:scale(0.85); } 50%{ opacity:0.95; transform:scale(1.05); } }
  .deco-bubble{ border-radius:50%; background:rgba(255,255,255,0.35); animation:floatUp 3.6s ease-in infinite; }
  .deco-leaf{ animation:sway 3.2s ease-in-out infinite; transform-origin:bottom center; }
  .deco-spark{ border-radius:50%; background:var(--coral); animation:twinkle 1.8s ease-in-out infinite; }
  .sheet-head .logo-row{ margin-bottom:10px; position:relative; z-index:1; }
  .sheet-head .eyebrow{ color:#7FCFCB; position:relative; z-index:1; }
  .sheet-head h2{ color:var(--white); font-size:25px; margin-top:6px; position:relative; z-index:1; }
  .sheet-head .subline{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:#9FC7C3; margin-top:6px; position:relative; z-index:1; }
  .sheet-wave{ display:block; width:200%; height:12px; animation:waveDrift 8s linear infinite; }
  @keyframes waveDrift{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  .sheet-body{ padding:20px 20px 26px; }
  .sheet .price-tag{ font-family:'IBM Plex Mono', monospace; font-size:30px; color:var(--coral); margin:2px 0 4px; }
  .sheet ul{ padding-left:18px; margin:14px 0 18px; font-size:13.5px; line-height:1.7; color:#3a4642; }
  .sheet .row-btns{ display:flex; gap:10px; }
  .btn-primary{ flex:1; background:var(--coral); color:var(--white); border:none; font-family:'IBM Plex Mono', monospace; font-size:12.5px; letter-spacing:0.03em; padding:13px; border-radius:9px; cursor:pointer; transition:transform 0.15s ease; }
  .btn-primary:hover{ transform:translateY(-1px); }
  .fine{ font-size:11px; color:#8a8477; margin-top:12px; line-height:1.5; }
  .close-x{ position:absolute; top:14px; right:16px; background:rgba(255,255,255,0.12); border:none; width:28px; height:28px; border-radius:50%; font-size:18px; color:var(--white); cursor:pointer; line-height:1; z-index:2; }
  .search-input{ width:100%; padding:11px 14px; border-radius:8px; border:1px solid var(--line); font-family:'Work Sans', sans-serif; font-size:14px; background:var(--white); color:var(--charcoal); }
  .picker-group{ margin-bottom:4px; }
  .picker-atoll-toggle{ width:100%; display:flex; align-items:center; justify-content:space-between; background:transparent; border:none; cursor:pointer; text-align:left; font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--teal); padding:12px 4px 4px; }
  .picker-atoll-toggle .chevron{ font-size:11px; transition:transform 0.2s ease; display:inline-block; }
  .picker-atoll-toggle.open .chevron{ transform:rotate(90deg); }
  .picker-atoll-body{ overflow:hidden; max-height:0; transition:max-height 0.25s ease; }
  .picker-atoll-body.open{ max-height:2000px; }
  .picker-row{ display:flex; justify-content:space-between; align-items:center; padding:11px 8px; border-bottom:1px solid var(--line); cursor:pointer; font-family:'Work Sans', sans-serif; font-size:14px; }
  .picker-row:hover{ background:var(--sand-2); }
  .picker-atoll{ font-family:'IBM Plex Mono', monospace; font-size:10px; color:#9aa39e; }
  .hidden{ display:none !important; }
  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--charcoal); color:var(--white); padding:10px 16px; border-radius:20px; font-family:'IBM Plex Mono', monospace; font-size:11.5px; z-index:60; opacity:0; transition:opacity 0.25s ease; pointer-events:none; max-width:88vw; text-align:center; }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="logo-row">
      <svg class="logo-mark" width="26" height="26" viewBox="0 0 64 64"><circle cx="32" cy="34" r="20" fill="none" stroke="var(--teal)" stroke-width="5"/><path d="M32 9 L32 34 L45 34 Z" fill="var(--coral)"/><circle cx="32" cy="34" r="3" fill="var(--ink-2)"/></svg>
      <div><span class="eyebrow">Atoll Isle</span><h1>Business Portal</h1></div>
    </div>
    <a class="back-link" href="index.html">Tourist app ↗</a>
  </div>

  <div class="content">
    <div id="portalSignedOut">
      <p style="font-size:13px; line-height:1.6; color:#3a4642; margin-top:0;">
        List your guesthouse, café, dive shop or excursion so tourists can find you the moment they land. Create a free account to get started — 1 listing free, or go Pro for up to 10.
      </p>
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabSignIn">Sign in</button>
        <button class="auth-tab" id="tabSignUp">Create account</button>
      </div>
      <div class="auth-err hidden" id="authErr"></div>
      <div class="field"><label>Business email</label><input type="email" id="authEmail" placeholder="you@business.mv"></div>
      <div class="field"><label>Password</label><input type="password" id="authPass" placeholder="••••••••"></div>
      <button class="btn-block" id="authSubmit">Sign in</button>
    </div>

    <div id="portalSignedIn" class="hidden">
      <div id="acctCard"></div>
      <div class="section-label">
        <span id="portalWho">Your listings</span>
        <button class="del-btn" id="portalSignOut">Sign out</button>
      </div>
      <div id="myListings"></div>
      <button class="btn-block" id="showAddForm" style="margin-top:16px;">+ Add a business</button>
      <button class="btn-ghost" id="showClaimForm" style="width:100%; margin-top:8px;">Claim an existing public listing</button>

      <div style="margin-top:24px; border-top:1px solid var(--line); padding-top:16px;">
        <div class="section-label">Post an event</div>
        <div class="field"><label>Event title</label><input id="e-title" placeholder="Full Moon Beach BBQ"></div>
        <div class="field"><label>Island</label><button type="button" class="field-btn placeholder" id="e-island-btn" data-island="">Choose island…</button></div>
        <div class="field"><label>Date</label><input id="e-date" placeholder="e.g. 22 Aug, 7pm"></div>
        <div class="field"><label>Details</label><textarea id="e-desc" placeholder="Who it's for, cost, where to meet"></textarea></div>
        <button class="btn-block" id="saveEvent">Post event</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  const API_BASE = "https://atollisle.onrender.com";
  const CATEGORIES = ["Guesthouses","Hotels & Resorts","Cafés & Restaurants","Excursions & Dive","Shops & Rentals","Attractions & Activities"];
  const BIZ_FREE_LIMIT = 1;
  const BIZ_PRO_LIMIT = 10;
  const BIZ_PRO_PRICE = "$10"; // placeholder price — change freely, no amount was specified

  // Fallback only — the live list comes from the API so Super Admin renames apply everywhere.
  let ATOLLS = [
    {atoll:"Haa Alif Atoll", islands:["Baarah","Dhiddhoo","Filladhoo","Hoarafushi","Ihavandhoo","Kelaa","Maarandhoo","Mulhadhoo","Muraidhoo","Thakandhoo","Thuraakunu","Utheemu","Vashafaru","Uligan"]},
    {atoll:"Haa Dhaalu Atoll", islands:["Finey","Hirilandhoo","Hanimaadhoo","Kattakuredhoo","Kulhudhuffushi","Kumundhoo","Kurinbi","Makunudhoo","Navaidhoo","Nellaidhoo","Neykurendhoo","Nolhivaram","Nolhivaranfaru","Vaikaradhoo"]},
    {atoll:"Shaviyani Atoll", islands:["Bileffahi","Feevah","Feydhoo","Foakaidhoo","Funadhoo","Goidhoo","Kanditheemu","Komandoo","Lhaimagu","Maaungoodhoo","Narudhoo","Noomaraa","Milandhoo","Maroshi"]},
    {atoll:"Noonu Atoll", islands:["Foddhoo","Henbadhoo","Holhudhoo","Kendhikulhudhoo","Kudafari","Landhoo","Lhohi","Maalhendhoo","Magoodhoo","Manadhoo","Miladhoo","Velidhoo"]},
    {atoll:"Raa Atoll", islands:["Alifushi","Angolhitheemu","Fainu","Hulhudhuffaaru","Inguraidhoo","Innamaadhoo","Dhuvaafaru","Kandholhudhoo","Kinnolhas","Maakurathu","Maduvvari","Meedhoo","Rasgetheemu","Rasmadhoo","Ungoofaaru","Vaadhoo"]},
    {atoll:"Baa Atoll", islands:["Dharavandhoo","Dhonfanu","Eydafushi","Fehendhoo","Fulhadhoo","Goidhoo","Hitheadhoo","Kamadhoo","Kendhoo","Kihaadhoo","Kudarikilu","Maalhos","Thulhaadhoo"]},
    {atoll:"Lhaviyani Atoll", islands:["Hinnavaru","Kurendhoo","Maafilaafushi","Naifaru","Olhuvelifushi"]},
    {atoll:"Kaafu Atoll & Malé", islands:["Malé","Villingili","Hulhumalé","Hulhulé","Dhiffushi","Gaafaru","Gulhi","Guraidhoo","Himmafushi","Huraa","Kaashidhoo","Maafushi","Thulusdhoo"]},
    {atoll:"Alif Alif Atoll", islands:["Bodufolhudhoo","Feridhoo","Himandhoo","Mathiveri","Rasdhoo","Thoddoo","Ukulhas","Maalhos"]},
    {atoll:"Alif Dhaal Atoll", islands:["Dhigurah","Fenfushi","Hangnaameedhoo","Kunburudhoo","Maamigili","Mahibadhoo","Mandhoo","Omadhoo","Dhangethi","Dhidhdhoo"]},
    {atoll:"Vaavu Atoll", islands:["Felidhoo","Fulidhoo","Keyodhoo","Rakeedhoo","Thinadhoo"]},
    {atoll:"Meemu Atoll", islands:["Dhiggaru","Kolhufushi","Maduvvaree","Mulah","Muli","Naalaafushi","Raimmandhoo","Veyvah"]},
    {atoll:"Faafu Atoll", islands:["Feeali","Bileddhoo","Dharanboodhoo","Magoodhoo","Nilandhoo"]},
    {atoll:"Dhaalu Atoll", islands:["Bandidhoo","Gemendhoo","Huluhedheli","Kudahuvadhoo","Maaenboodhoo","Meedhoo","Rinbudhoo"]},
    {atoll:"Thaa Atoll", islands:["Buruni","Dhiyamigili","Gaadhiffushi","Guraidhoo","Hirilandhoo","Kandoodhoo","Kinbidhoo","Madifushi","Omadhoo","Thimarafushi","Vandhoo","Veimandoo","Vilufushi"]},
    {atoll:"Laamu Atoll", islands:["Dhanbidhoo","Fonadhoo","Gaadhoo","Gan","Isdhoo","Kalaidhoo","Kunahandhoo","Maabaidhoo","Maamendhoo","Maavah","Mundoo"]},
    {atoll:"Gaafu Alifu Atoll", islands:["Dhaandhoo","Dhevvadhoo","Gemanafushi","Kanduhulhudhoo","Kolamaafushi","Kondey","Maamendhoo","Nilandhoo","Villingili"]},
    {atoll:"Gaafu Dhaalu Atoll", islands:["Fares-Maathoda","Fiyoari","Gaddhoo","Hoandeddhoo","Nadella","Rathafandhoo","Thinadhoo","Vaadhoo","Madaveli"]},
    {atoll:"Gnaviyani Atoll", islands:["Fuvahmulah"]},
    {atoll:"Seenu Atoll", islands:["Feydhoo","Hithadhoo","Hulhudhoo","Meedhoo","Maradhoo","Maradhoo-Feydhoo"]}
  ];

  let state = { bizToken: null, bizEmail: null, authMode: "signin" };

  function lsGet(key, fallback){ try{ const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }catch(e){ return fallback; } }
  function lsSet(key, value){ try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){} }

  async function api(path, opts){
    opts = opts || {};
    const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    if(state.bizToken) headers["Authorization"] = "Bearer " + state.bizToken;
    try{
      const res = await fetch(API_BASE + path, { method: opts.method || "GET", headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
      const data = await res.json().catch(()=>({}));
      if(!res.ok) return { ok:false, status:res.status, error: data.error || "Request failed", data };
      return { ok:true, data };
    }catch(e){
      return { ok:false, status:0, error:"Can't reach the API — is server.js running at " + API_BASE + "?", data:null };
    }
  }

  function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2400); }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s){ return escapeHtml(s); }
  function catLabel(c){ return c; } // portal stays English-only — categories shown as stored
  function fmtDate(ms){ return new Date(ms).toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'}); }

  function themeFor(category){
    const map = {
      "Guesthouses":"warm", "Hotels & Resorts":"warm",
      "Cafés & Restaurants":"festive", "Shops & Rentals":"festive",
      "Excursions & Dive":"ocean", "Attractions & Activities":"ocean",
      "pro":"festive", "business":"warm"
    };
    return map[category] || "default";
  }
  function themeDecor(theme){
    if(theme === 'ocean'){
      return `<div class="deco deco-bubble" style="left:14%; bottom:6px; width:9px; height:9px;"></div>
        <div class="deco deco-bubble" style="left:26%; bottom:10px; width:6px; height:6px; animation-delay:0.9s;"></div>
        <div class="deco deco-bubble" style="left:82%; bottom:4px; width:11px; height:11px; animation-delay:1.6s;"></div>
        <div class="deco deco-bubble" style="left:70%; bottom:14px; width:5px; height:5px; animation-delay:2.3s;"></div>`;
    }
    if(theme === 'warm'){
      return `<svg class="deco deco-leaf" style="right:16px; top:8px;" width="30" height="30" viewBox="0 0 40 40"><path d="M20 36 C10 28 8 14 20 4 C32 14 30 28 20 36 Z" fill="rgba(255,255,255,0.18)"/></svg>
        <svg class="deco deco-leaf" style="right:42px; top:16px; animation-delay:0.6s;" width="20" height="20" viewBox="0 0 40 40"><path d="M20 36 C10 28 8 14 20 4 C32 14 30 28 20 36 Z" fill="rgba(255,255,255,0.14)"/></svg>`;
    }
    if(theme === 'festive'){
      return `<div class="deco deco-spark" style="left:18%; top:14px; width:5px; height:5px;"></div>
        <div class="deco deco-spark" style="left:76%; top:10px; width:4px; height:4px; animation-delay:0.5s;"></div>
        <div class="deco deco-spark" style="left:60%; top:22px; width:6px; height:6px; animation-delay:0.9s; background:#F5C34D;"></div>`;
    }
    return '';
  }
  function sheetShell(opts){
    const closeBtn = opts.closeId ? `<button class="close-x" id="${opts.closeId}">&times;</button>` : '';
    const theme = opts.theme || 'default';
    const themeClass = theme !== 'default' ? ` theme-${theme}` : '';
    return `
      <div class="sheet">
        <div class="sheet-head${themeClass}">
          ${themeDecor(theme)}
          ${closeBtn}
          <div class="logo-row">
            <svg width="22" height="22" viewBox="0 0 64 64"><circle cx="32" cy="34" r="20" fill="none" stroke="var(--teal)" stroke-width="5"/><path d="M32 9 L32 34 L45 34 Z" fill="var(--coral)"/><circle cx="32" cy="34" r="3" fill="var(--sand)"/></svg>
            <span class="eyebrow">${escapeHtml(opts.eyebrow || '')}</span>
          </div>
          <h2>${opts.title}</h2>
          ${opts.subline ? `<div class="subline">${opts.subline}</div>` : ''}
        </div>
        <svg class="sheet-wave" viewBox="0 0 800 12" preserveAspectRatio="none"><path d="M0 6 Q 20 0 40 6 T 80 6 T 120 6 T 160 6 T 200 6 T 240 6 T 280 6 T 320 6 T 360 6 T 400 6 T 440 6 T 480 6 T 520 6 T 560 6 T 600 6 T 640 6 T 680 6 T 720 6 T 760 6 T 800 6" fill="none" stroke="var(--coral)" stroke-width="2"/></svg>
        <div class="sheet-body">${opts.body}</div>
      </div>`;
  }

  // ---------- reusable island picker popup (search + collapsed-by-default atoll groups) ----------
  function renderPickerList(container, filterText, onSelect){
    const filter = (filterText || '').trim().toLowerCase();
    if(filter){
      const matches = [];
      ATOLLS.forEach(a => a.islands.forEach(isl => { if(isl.toLowerCase().includes(filter)) matches.push({isl, atoll:a.atoll}); }));
      container.innerHTML = matches.length ? matches.map(m => `
        <div class="picker-row" data-island="${escapeAttr(m.isl)}"><span>${escapeHtml(m.isl)}</span><span class="picker-atoll">${escapeHtml(m.atoll)}</span></div>
      `).join('') : `<div class="empty">No islands match "${escapeHtml(filterText)}"</div>`;
      container.querySelectorAll('.picker-row').forEach(row => { row.addEventListener('click', () => onSelect(row.getAttribute('data-island'))); });
    } else {
      container.innerHTML = ATOLLS.map((a,gi) => `
        <div class="picker-group">
          <button type="button" class="picker-atoll-toggle" data-atoll-idx="${gi}"><span>${escapeHtml(a.atoll)}</span><span class="chevron">▸</span></button>
          <div class="picker-atoll-body" id="pickerAtoll${gi}">
            ${a.islands.map(isl => `<div class="picker-row" data-island="${escapeAttr(isl)}"><span>${escapeHtml(isl)}</span></div>`).join('')}
          </div>
        </div>`).join('');
      container.querySelectorAll('.picker-atoll-toggle').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          btn.classList.toggle('open');
          document.getElementById('pickerAtoll' + btn.getAttribute('data-atoll-idx')).classList.toggle('open');
        });
      });
      container.querySelectorAll('.picker-row').forEach(row => { row.addEventListener('click', () => onSelect(row.getAttribute('data-island'))); });
    }
  }

  function openIslandPicker(onSelect){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = sheetShell({
      closeId: 'islandPickerClose', eyebrow: 'Select island', title: 'Choose an island',
      body: `<input type="text" id="islandPickerSearch" class="search-input" placeholder="Search islands…" style="margin-bottom:12px;">
             <div id="islandPickerResults" style="max-height:52vh; overflow-y:auto;"></div>`
    });
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.remove(); });
    document.getElementById('islandPickerClose').addEventListener('click', ()=>overlay.remove());
    const resultsEl = document.getElementById('islandPickerResults');
    const searchEl = document.getElementById('islandPickerSearch');
    function refresh(){ renderPickerList(resultsEl, searchEl.value, (isl)=>{ overlay.remove(); onSelect(isl); }); }
    searchEl.addEventListener('input', refresh);
    refresh();
    searchEl.focus();
  }

  // ---------- business account ----------
  function bizDaysLeft(proExpiry){ return proExpiry ? Math.ceil((proExpiry - Date.now()) / 86400000) : 0; }

  function openBizUpgradeModal(acct){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = sheetShell({
      eyebrow: acct.isPro ? 'Renew subscription' : 'One-time unlock', title: 'Business Pro', theme: 'pro',
      body: `
        <div class="price-tag">${BIZ_PRO_PRICE}<span style="font-size:14px; color:var(--charcoal); font-family:'Work Sans',sans-serif;"> / 30 days</span></div>
        <ul>
          <li>List up to ${BIZ_PRO_LIMIT} businesses (free plan: ${BIZ_FREE_LIMIT})</li>
          <li>30-day subscription period</li>
          <li>Renewing early adds 30 days to your current expiry, it doesn't reset it</li>
        </ul>
        <div class="row-btns">
          <button class="btn-ghost" id="bizCancel">Not now</button>
          <button class="btn-primary" id="bizConfirm">${acct.isPro ? 'Renew — ' + BIZ_PRO_PRICE : 'Upgrade — ' + BIZ_PRO_PRICE}</button>
        </div>
        <p class="fine">Demo checkout — this calls the API's mock upgrade endpoint. A live release needs a payment processor (e.g. Stripe) with recurring billing wired into server.js before this button charges a real card.</p>`
    });
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.remove(); });
    overlay.querySelector('#bizCancel').addEventListener('click', ()=>overlay.remove());
    overlay.querySelector('#bizConfirm').addEventListener('click', async ()=>{
      const r = await api('/api/account/upgrade', { method:'POST' });
      overlay.remove();
      if(!r.ok){ toast(r.error); return; }
      toast("Business Pro active until " + fmtDate(r.data.proExpiry));
      refreshPortal();
    });
  }

  function renderAcctCard(acct){
    const slot = document.getElementById('acctCard');
    const daysLeft = bizDaysLeft(acct.proExpiry);
    const warn = acct.isPro && daysLeft <= 3;
    let metaLine = acct.isPro
      ? `Business Pro · expires ${fmtDate(acct.proExpiry)} (${daysLeft} day${daysLeft===1?'':'s'} left)`
      : "Free plan · 1 business listing included";
    slot.innerHTML = `
      <div class="acct-card">
        <div class="acct-top">
          <div class="acct-email">${escapeHtml(acct.email)}</div>
          <span class="acct-plan ${acct.isPro?'pro':'free'}">${acct.isPro?'PRO':'FREE'}</span>
        </div>
        <div class="acct-meta ${warn?'warn':''}">${metaLine}</div>
        <button class="pro-cta" id="acctUpgradeBtn" style="margin-top:12px;">${acct.isPro ? 'Renew now' : ('Upgrade to Pro — ' + BIZ_PRO_PRICE)}</button>
      </div>`;
    document.getElementById('acctUpgradeBtn').addEventListener('click', ()=>openBizUpgradeModal(acct));
  }

  function openAddListingForm(acct){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = sheetShell({
      closeId: 'addClose', eyebrow: 'Business Portal', title: 'Add a business', theme: 'business',
      subline: `${acct.listingCount}/${acct.listingLimit} listings used`,
      body: `
        <div class="field"><label>Business name</label><input id="f-name" placeholder="Ocean Breeze Guesthouse"></div>
        <div class="field"><label>Category</label><select id="f-cat"></select></div>
        <div class="field"><label>Island</label><button type="button" class="field-btn placeholder" id="f-island-btn" data-island="">Choose island…</button></div>
        <div class="field"><label>Description</label><textarea id="f-desc" placeholder="What makes your place worth a stop?"></textarea></div>
        <div class="field"><label>Price range (optional)</label><input id="f-price" placeholder="e.g. $25–40/night"></div>
        <div class="field"><label>Contact (phone or WhatsApp)</label><input id="f-contact" placeholder="+960 7xx xxxx"></div>
        <button class="btn-block" id="saveListing">Save listing</button>`
    });
    document.body.appendChild(overlay);
    document.getElementById('f-cat').innerHTML = CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('');
    overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.remove(); });
    document.getElementById('addClose').addEventListener('click', ()=>overlay.remove());
    document.getElementById('f-island-btn').addEventListener('click', ()=>{
      openIslandPicker((isl)=>{
        const btn = document.getElementById('f-island-btn');
        btn.textContent = isl;
        btn.setAttribute('data-island', isl);
        btn.classList.remove('placeholder');
      });
    });
    document.getElementById('saveListing').addEventListener('click', async ()=>{
      const name = document.getElementById('f-name').value.trim();
      const island = document.getElementById('f-island-btn').getAttribute('data-island');
      if(!name){ toast("Business name is required"); return; }
      if(!island){ toast("Choose an island"); return; }
      const body = {
        name, category: document.getElementById('f-cat').value, island,
        desc: document.getElementById('f-desc').value.trim(), price: document.getElementById('f-price').value.trim(),
        contact: document.getElementById('f-contact').value.trim()
      };
      const r = await api('/api/my-listings', { method:'POST', body });
      if(!r.ok){ toast(r.error); return; }
      overlay.remove();
      toast(r.data.flagged ? "Listing added — flagged for admin review (matches a public Google listing)" : "Listing added");
      refreshPortal();
    });
  }

  function openClaimSheet(acct){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = sheetShell({
      closeId: 'claimClose', eyebrow: 'Business Portal', title: 'Claim your listing', theme: 'business',
      subline: 'Public listings found on Google — claim yours instead of creating a duplicate',
      body: `
        <div class="field"><label>Island</label><button type="button" class="field-btn placeholder" id="claim-island-btn" data-island="">Choose island…</button></div>
        <div class="field"><label>Search by name (optional)</label><input id="claim-q" placeholder="Start typing your business name"></div>
        <div id="claimResults" style="margin-top:6px;"></div>`
    });
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.remove(); });
    document.getElementById('claimClose').addEventListener('click', ()=>overlay.remove());
    const islandBtn = document.getElementById('claim-island-btn');
    islandBtn.addEventListener('click', ()=>{
      openIslandPicker((isl)=>{
        islandBtn.textContent = isl;
        islandBtn.setAttribute('data-island', isl);
        islandBtn.classList.remove('placeholder');
        loadResults();
      });
    });

    async function loadResults(){
      const island = islandBtn.getAttribute('data-island');
      const wrap = document.getElementById('claimResults');
      if(!island){ wrap.innerHTML = `<div class="empty">Choose an island to see unclaimed public listings there.</div>`; return; }
      const qs = new URLSearchParams({ island });
      const q = document.getElementById('claim-q').value.trim();
      if(q) qs.set('q', q);
      const r = await api('/api/unclaimed?' + qs.toString());
      if(!r.ok){ wrap.innerHTML = `<div class="empty">${escapeHtml(r.error)}</div>`; return; }
      if(!r.data.length){ wrap.innerHTML = `<div class="empty">No unclaimed public listings found here. You can add a new one instead.</div>`; return; }
      wrap.innerHTML = r.data.map(b => `
        <div class="owner-card">
          <div><div class="oc-name">${escapeHtml(b.name)}</div><div class="oc-cat">${escapeHtml(catLabel(b.category))} · ${escapeHtml(b.desc || '')}</div></div>
          <button class="btn-primary" style="flex:0 0 auto; padding:9px 12px;" data-claim="${b.id}">This is mine</button>
        </div>`).join('');
      wrap.querySelectorAll('[data-claim]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const cr = await api('/api/my-listings/claim/' + btn.getAttribute('data-claim'), { method:'POST' });
          if(!cr.ok){ toast(cr.error); if(cr.status===403) { overlay.remove(); openBizUpgradeModal(acct); } return; }
          overlay.remove();
          toast("Listing claimed — you can edit its details by removing and re-adding it");
          refreshPortal();
        });
      });
    }
    document.getElementById('claim-q').addEventListener('input', loadResults);
    loadResults();
  }

  function switchAuthTab(mode){
    state.authMode = mode;
    document.getElementById('tabSignIn').classList.toggle('active', mode==='signin');
    document.getElementById('tabSignUp').classList.toggle('active', mode==='signup');
    document.getElementById('authSubmit').textContent = mode==='signin' ? 'Sign in' : 'Create account';
    document.getElementById('authErr').classList.add('hidden');
  }

  async function refreshPortal(){
    if(!state.bizToken){
      document.getElementById('portalSignedOut').classList.remove('hidden');
      document.getElementById('portalSignedIn').classList.add('hidden');
      return;
    }
    const acctR = await api('/api/account');
    if(!acctR.ok){
      state.bizToken = null; state.bizEmail = null;
      lsSet('ii-biz-token', null); lsSet('ii-biz-email', null);
      refreshPortal();
      return;
    }
    document.getElementById('portalSignedOut').classList.add('hidden');
    document.getElementById('portalSignedIn').classList.remove('hidden');
    renderAcctCard(acctR.data);
    document.getElementById('portalWho').textContent = "Listings for " + acctR.data.email;
    const listR = await api('/api/my-listings');
    const mine = listR.ok ? listR.data : [];
    const wrap = document.getElementById('myListings');
    wrap.innerHTML = mine.length ? mine.map(b => `
      <div class="owner-card">
        <div><div class="oc-name">${escapeHtml(b.name)}</div><div class="oc-cat">${escapeHtml(b.category)} · ${escapeHtml(b.island)}</div></div>
        <button class="del-btn" data-del="${b.id}">Remove</button>
      </div>`).join('') : `<div class="empty">No listings yet — add your first one below.</div>`;
    wrap.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const r = await api('/api/my-listings/' + btn.getAttribute('data-del'), { method:'DELETE' });
        if(!r.ok){ toast(r.error); return; }
        toast("Listing removed");
        refreshPortal();
      });
    });
    const addBtn = document.getElementById('showAddForm');
    addBtn.textContent = acctR.data.listingCount >= acctR.data.listingLimit
      ? `Limit reached (${acctR.data.listingCount}/${acctR.data.listingLimit}) — upgrade for more`
      : `+ Add a business (${acctR.data.listingCount}/${acctR.data.listingLimit})`;
    addBtn.onclick = () => {
      if(acctR.data.listingCount >= acctR.data.listingLimit){ openBizUpgradeModal(acctR.data); return; }
      openAddListingForm(acctR.data);
    };
    document.getElementById('showClaimForm').onclick = () => {
      if(acctR.data.listingCount >= acctR.data.listingLimit){ openBizUpgradeModal(acctR.data); return; }
      openClaimSheet(acctR.data);
    };
  }

  function wire(){
    document.getElementById('tabSignIn').addEventListener('click', ()=>switchAuthTab('signin'));
    document.getElementById('tabSignUp').addEventListener('click', ()=>switchAuthTab('signup'));
    document.getElementById('authSubmit').addEventListener('click', async ()=>{
      const email = document.getElementById('authEmail').value.trim();
      const pass = document.getElementById('authPass').value;
      const errEl = document.getElementById('authErr');
      errEl.classList.add('hidden');
      const path = state.authMode === 'signup' ? '/api/auth/signup' : '/api/auth/login';
      const r = await api(path, { method:'POST', body:{ email, password: pass } });
      if(!r.ok){ errEl.textContent = r.error; errEl.classList.remove('hidden'); return; }
      state.bizToken = r.data.token;
      state.bizEmail = r.data.email;
      lsSet('ii-biz-token', state.bizToken);
      lsSet('ii-biz-email', state.bizEmail);
      document.getElementById('authEmail').value = ''; document.getElementById('authPass').value = '';
      refreshPortal();
    });
    document.getElementById('portalSignOut').addEventListener('click', async ()=>{
      await api('/api/auth/logout', { method:'POST' });
      state.bizToken = null; state.bizEmail = null;
      lsSet('ii-biz-token', null); lsSet('ii-biz-email', null);
      refreshPortal();
    });
    document.getElementById('e-island-btn').addEventListener('click', ()=>{
      openIslandPicker((isl)=>{
        const btn = document.getElementById('e-island-btn');
        btn.textContent = isl;
        btn.setAttribute('data-island', isl);
        btn.classList.remove('placeholder');
      });
    });
    document.getElementById('saveEvent').addEventListener('click', async ()=>{
      const title = document.getElementById('e-title').value.trim();
      const island = document.getElementById('e-island-btn').getAttribute('data-island');
      if(!title){ toast("Event title is required"); return; }
      if(!island){ toast("Choose an island"); return; }
      const body = { title, island, date: document.getElementById('e-date').value.trim(), desc: document.getElementById('e-desc').value.trim() };
      const r = await api('/api/events', { method:'POST', body });
      if(!r.ok){ toast(r.error); return; }
      ['e-title','e-date','e-desc'].forEach(id=>document.getElementById(id).value='');
      const btn = document.getElementById('e-island-btn');
      btn.textContent = 'Choose island…'; btn.setAttribute('data-island',''); btn.classList.add('placeholder');
      toast("Event posted");
    });
  }

  async function loadAtolls(){
    try{
      const res = await fetch(API_BASE + '/api/atolls');
      if(res.ok){
        const data = await res.json();
        if(Array.isArray(data) && data.length) ATOLLS = data;
      }
    }catch(e){ /* keep the built-in fallback list */ }
  }

  async function init(){
    state.bizToken = lsGet('ii-biz-token', null);
    state.bizEmail = lsGet('ii-biz-email', null);
    await loadAtolls();
    wire();
    refreshPortal();
  }

  init();
})();
</script>
</body>
</html>
